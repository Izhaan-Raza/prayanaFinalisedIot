<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup - Prayana</title>
    <script>
        async function signup() {
            const token = document.getElementById("signup-token").value;
            const username = document.getElementById("signup-username").value;
            const password = document.getElementById("signup-password").value;
            const re_password = document.getElementById("signup-repassword").value;

            const response = await fetch('http://127.0.0.1:5000/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, username, password, re_password })
            });

            const result = await response.json();
            alert(result.message || result.error);
        }

        async function login() {
            const username = document.getElementById("login-username").value;
            const password = document.getElementById("login-password").value;

            const response = await fetch('http://127.0.0.1:5000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            const result = await response.json();
            alert(result.message || result.error);
        }
    </script>
</head>
<body>
    <h2>Signup</h2>
    <input type="text" id="signup-token" placeholder="Token" required><br>
    <input type="text" id="signup-username" placeholder="Username" required><br>
    <input type="password" id="signup-password" placeholder="Password" required><br>
    <input type="password" id="signup-repassword" placeholder="Re-enter Password" required><br>
    <button onclick="signup()">Signup</button>

    <h2>Login</h2>
    <input type="text" id="login-username" placeholder="Username" required><br>
    <input type="password" id="login-password" placeholder="Password" required><br>
    <button onclick="login()">Login</button>
</body>
</html>
